name: Android checks
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: Build, unit tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test development helpers
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Build, unit tests and lint
        run: bash scripts/check.sh
      - name: Upload verified APKs and receipts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: seen-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            .tools/check-result.json
            app/schemas/
          include-hidden-files: true
          retention-days: 14
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.sha }}
          path: |
            build/reports/
            app/build/reports/
            .tools/build-latest.log
          include-hidden-files: true
          retention-days: 14
